<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solana's Perfect Circle</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #2a2a3a;
    --accent: #e8ff5a;
    --accent2: #5affd1;
    --text: #f0f0f8;
    --muted: #6060a0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(90,255,209,0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(232,255,90,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.5rem, 8vw, 5rem);
    letter-spacing: 0.08em;
    color: var(--accent);
    text-shadow: 0 0 40px rgba(232,255,90,0.3);
    margin-bottom: 0.2em;
  }

  .subtitle {
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 2rem;
  }

  .canvas-wrap {
    position: relative;
  }

  canvas {
    display: block;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
    cursor: crosshair;
    box-shadow: 0 0 0 1px var(--border), 0 0 60px rgba(90,255,209,0.05);
    touch-action: none;
  }

  .hint {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-top: 1.2rem;
    text-transform: uppercase;
    transition: opacity 0.3s;
  }

  .score-display {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
  }

  .score-display.show { opacity: 1; }

  .score-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 12vw, 6rem);
    line-height: 1;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(232,255,90,0.5));
  }

  .score-label {
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 0.3em;
  }

  .score-grade {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.1em;
    margin-top: 0.5em;
  }

  .btn {
    margin-top: 1.5rem;
    padding: 0.65rem 2rem;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0;
    pointer-events: none;
  }

  .btn.show {
    opacity: 1;
    pointer-events: all;
  }

  .btn:hover {
    background: var(--accent);
    color: var(--bg);
    box-shadow: 0 0 20px rgba(232,255,90,0.3);
  }

  .best {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    margin-top: 0.8rem;
    text-transform: uppercase;
    min-height: 1.2em;
  }

  .best span { color: var(--accent2); }
</style>
</head>
<body>

<h1>Solana's Perfect Circle</h1>
<p class="subtitle">Draw the perfect circle freehand &mdash; ca</p>

<div class="canvas-wrap">
  <canvas id="c"></canvas>
  <div class="score-display" id="scoreDisplay">
    <div class="score-num" id="scoreNum">0%</div>
    <div class="score-label">Circularity</div>
    <div class="score-grade" id="scoreGrade"></div>
  </div>
</div>

<p class="hint" id="hint">Click and drag to draw</p>
<button class="btn" id="retryBtn" onclick="reset()">↺ Try Again</button>
<p class="best" id="bestDisplay"></p>

<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const scoreNum = document.getElementById('scoreNum');
  const scoreGrade = document.getElementById('scoreGrade');
  const hint = document.getElementById('hint');
  const retryBtn = document.getElementById('retryBtn');
  const bestDisplay = document.getElementById('bestDisplay');

  const SIZE = Math.min(window.innerWidth * 0.92, window.innerHeight * 0.7, 600);
  canvas.width = SIZE;
  canvas.height = SIZE;

  let drawing = false;
  let points = [];
  let best = parseFloat(localStorage.getItem('circle_best') || '0');
  if (best > 0) bestDisplay.innerHTML = `Best: <span>${best.toFixed(1)}%</span>`;

  function getPos(e) {
    const r = canvas.getBoundingClientRect();
    if (e.touches) {
      return { x: e.touches[0].clientX - r.left, y: e.touches[0].clientY - r.top };
    }
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  function startDraw(e) {
    e.preventDefault();
    reset(true);
    drawing = true;
    points = [];
    const p = getPos(e);
    points.push(p);
    hint.style.opacity = '0';
  }

  function moveDraw(e) {
    e.preventDefault();
    if (!drawing) return;
    const p = getPos(e);
    points.push(p);
    redraw();
  }

  function endDraw(e) {
    e.preventDefault();
    if (!drawing || points.length < 3) return;
    drawing = false;
    analyze();
  }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  canvas.addEventListener('mouseup', endDraw);
  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', moveDraw, { passive: false });
  canvas.addEventListener('touchend', endDraw, { passive: false });

  function redraw() {
    ctx.clearRect(0, 0, SIZE, SIZE);
    if (points.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(points[0].x, points[0].y);
    for (let i = 1; i < points.length; i++) {
      ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.strokeStyle = 'rgba(232,255,90,0.8)';
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  function analyze() {
    if (points.length < 3) return;

    // Find centroid
    let cx = 0, cy = 0;
    for (const p of points) { cx += p.x; cy += p.y; }
    cx /= points.length; cy /= points.length;

    // Radii
    const radii = points.map(p => Math.hypot(p.x - cx, p.y - cy));
    const avgR = radii.reduce((a, b) => a + b, 0) / radii.length;
    const variance = radii.reduce((sum, r) => sum + (r - avgR) ** 2, 0) / radii.length;
    const stdDev = Math.sqrt(variance);

    // Circularity score — stricter multiplier
    const cv = stdDev / avgR;
    let circScore = Math.max(0, 100 - cv * 280);

    // Coverage check — tighter tolerance, heavier penalty
    const angles = points.map(p => Math.atan2(p.y - cy, p.x - cx));
    const sorted = [...angles].sort((a, b) => a - b);
    let maxGap = 0;
    for (let i = 1; i < sorted.length; i++) maxGap = Math.max(maxGap, sorted[i] - sorted[i-1]);
    const endGap = (sorted[0] + 2 * Math.PI) - sorted[sorted.length - 1];
    maxGap = Math.max(maxGap, endGap);
    const coveragePenalty = Math.max(0, (maxGap / (2 * Math.PI)) - 0.05) * 140;
    circScore = Math.max(0, circScore - coveragePenalty);

    // Closing gap penalty — harder
    const startPt = points[0], endPt = points[points.length - 1];
    const closingGap = Math.hypot(endPt.x - startPt.x, endPt.y - startPt.y);
    const closingPenalty = Math.min(18, (closingGap / avgR) * 25);
    circScore = Math.max(0, circScore - closingPenalty);

    // Ellipse penalty — harder
    const maxR = Math.max(...radii);
    const minR = Math.min(...radii);
    const ellipticPenalty = ((maxR - minR) / avgR) * 35;
    circScore = Math.max(0, circScore - ellipticPenalty);

    // Smoothness penalty — punish shaky/jagged lines
    let totalJitter = 0;
    for (let i = 2; i < points.length; i++) {
      const dx1 = points[i-1].x - points[i-2].x, dy1 = points[i-1].y - points[i-2].y;
      const dx2 = points[i].x - points[i-1].x,   dy2 = points[i].y - points[i-1].y;
      const angle = Math.abs(Math.atan2(dy2, dx2) - Math.atan2(dy1, dx1));
      totalJitter += Math.min(angle, Math.PI * 2 - angle);
    }
    const avgJitter = totalJitter / points.length;
    const jitterPenalty = Math.min(20, avgJitter * 18);
    circScore = Math.max(0, circScore - jitterPenalty);

    // Savage exponential ceiling — scores compress hard above 70%, near impossible above 90%
    const CEILING = 99.5;
    circScore = CEILING * (1 - Math.pow(1 - circScore / 100, 5));
    circScore = Math.min(CEILING, circScore);

    showResult(circScore, cx, cy, avgR);
  }

  function showResult(score, cx, cy, r) {
    // Draw ideal circle ghost
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(90,255,209,0.25)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 6]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Redraw user's circle on top
    redraw();

    scoreNum.textContent = score.toFixed(1) + '%';
    scoreGrade.textContent = getGrade(score);
    scoreGrade.style.color = getGradeColor(score);
    scoreDisplay.classList.add('show');
    retryBtn.classList.add('show');

    if (score > best) {
      best = score;
      localStorage.setItem('circle_best', best.toFixed(1));
      bestDisplay.innerHTML = `Best: <span>${best.toFixed(1)}%</span>`;
    }
  }

  function getGrade(s) {
    if (s >= 98) return '👁️ Are you even human?';
    if (s >= 95) return '🔵 Legendary';
    if (s >= 90) return '🟡 Near Perfect';
    if (s >= 80) return '🟢 Excellent';
    if (s >= 70) return '🟨 Great';
    if (s >= 55) return '🟧 Good';
    if (s >= 40) return '🟥 Decent';
    return '⬜ Bro... try again 😭';
  }

  function getGradeColor(s) {
    if (s >= 90) return 'var(--accent)';
    if (s >= 70) return 'var(--accent2)';
    if (s >= 50) return '#ffa94d';
    return 'var(--muted)';
  }

  function reset(silent = false) {
    ctx.clearRect(0, 0, SIZE, SIZE);
    points = [];
    drawing = false;
    scoreDisplay.classList.remove('show');
    retryBtn.classList.remove('show');
    if (!silent) hint.style.opacity = '1';
  }
</script>
</body>
</html>
